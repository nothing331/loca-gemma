# loca-gemma — local private AI assistant
#
# Phase 1: Open WebUI (chat interface) connected to the Ollama already running
# natively on this Mac. Ollama is NOT containerized — Open WebUI reaches the host
# Ollama at host.docker.internal:11434.
#
# Bring up:   docker compose up -d
# Open:       http://localhost:3000
# Logs:       docker compose logs -f open-webui
# Stop:       docker compose down            (data persists in the named volume)
#
# Phase 2 adds a searxng service for private web search. It has no published host
# port — Open WebUI reaches it internally at http://searxng:8080.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      # Reach the host's native Ollama from inside the container.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # First account created becomes admin; set to "false" to require login.
      - WEBUI_AUTH=true
      # Session/JWT signing key, from .env (keeps logins valid across restarts).
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      # Phase 2: private web search via the searxng service (internal network).
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      # Open WebUI 0.9.6 regression: web-search results are stored in an ephemeral
      # "web-search-*" vector collection, but chat-time retrieval drops it as an
      # "untrusted direct collection_name" unless access control is bypassed — so
      # every web search returns "No sources found" despite fetching pages fine.
      # This is harmless on a single-admin local instance and is the supported fix.
      - BYPASS_RETRIEVAL_ACCESS_CONTROL=true
      # Render pages with a real headless browser instead of a plain HTTP GET, so
      # JavaScript-heavy sites (live scores, SPAs) and bot-protected pages return
      # real content instead of nav boilerplate / "enable JavaScript" stubs. Also
      # sends a genuine browser User-Agent, which unblocks sources like Wikipedia.
      - WEB_LOADER_ENGINE=playwright
      - PLAYWRIGHT_WS_URL=ws://playwright:3000/
      - PLAYWRIGHT_TIMEOUT=15000
      # Pass more retrieved chunks to the model (default 3) so the relevant snippet
      # isn't pruned out by the top-K cut on content-heavy pages.
      - RAG_TOP_K=6
    extra_hosts:
      # Required on Linux; harmless on macOS where host.docker.internal already resolves.
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    # No host port published — only open-webui reaches it, over the compose network.
    environment:
      # Replaces the "ultrasecretkey" placeholder in settings.yml at startup.
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped

  # Headless-browser page renderer for web search. The image version MUST match the
  # `playwright` Python package inside open-webui (1.58.0) or chromium.connect() fails.
  # Internal only — open-webui connects at ws://playwright:3000/.
  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    container_name: playwright
    command: npx -y playwright@1.58.0 run-server --port 3000 --host 0.0.0.0
    restart: unless-stopped

volumes:
  open-webui:
